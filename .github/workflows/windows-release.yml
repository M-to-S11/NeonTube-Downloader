name: Portable Windows-Version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'build_windows.py'
      - 'app.py'
      - 'neontube_i18n.py'
      - 'requirements.txt'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neontube-windows-release
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check Python source files
        run: |
          python -m py_compile app.py neontube_i18n.py build_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed.' }
      - name: Version und Release prüfen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from build_windows import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Ungültige Build-Version.' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Der Git-Tag muss $tag lauten."
          }
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub-Releases konnten nicht geprüft werden.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          $exists = $tag -in $releases
          "build=true" >> $env:GITHUB_OUTPUT
          "publish=$(-not $exists)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Portable Windows-ZIP bauen
        if: steps.version.outputs.build == 'true'
        run: |
          python -m pip install -r requirements.txt "pyinstaller>=6.21"
          if ($LASTEXITCODE -ne 0) { throw 'Python-Abhängigkeiten konnten nicht installiert werden.' }
          ./install_deno.ps1
          ./install_ffmpeg.ps1
          python build_windows.py --mode onedir --portable-zip
      - name: Upload portable ZIP as a test artifact
        if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NeonTubeDownloader-V1.38.0-Multilingual-Test
          path: dist/NeonTubeDownloader_Portable_V1.38.0_Windows.zip
          if-no-files-found: error
          retention-days: 14
      - name: Release mit Windows-ZIP veröffentlichen
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "dist/NeonTubeDownloader_Portable_V${env:RELEASE_VERSION}_Windows.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "ZIP fehlt: $zip" }
          gh release create $env:RELEASE_TAG $zip --target $env:GITHUB_SHA `
            --title "NeonTube Downloader $env:RELEASE_TAG" `
            --notes 'Portable Version für Windows x64. ZIP vollständig entpacken und NeonTubeDownloader.exe starten. Die EXE ist unsigniert.'
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht veröffentlicht werden.' }
          $assetNames = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0 -or $assetNames -notcontains (Split-Path -Leaf $zip)) {
            throw 'Release asset could not be verified.'
          }
      - name: Fehlerhafte V1.38.1-Veröffentlichung nach erfolgreichem Ersatz entfernen
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.version == '1.38.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.38.1 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v1.38.1 --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw 'Die alte V1.38.1-Veröffentlichung konnte nicht entfernt werden.' }
          }
